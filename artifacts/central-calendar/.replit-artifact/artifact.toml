kind = "web"
previewPath = "/"
title = "Central Calendar"
version = "1.0.0"
id = "artifacts/central-calendar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25018

[services.development]
run = "pnpm --filter @workspace/central-calendar run dev"

[services.env]
PORT = "25018"
BASE_PATH = "/"

[services.production]
serve = "static"
publicDir = "artifacts/central-calendar/dist/public"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/central-calendar", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
